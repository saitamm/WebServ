server
    listen 127.0.0.1:8080
    server_name localhost
    root ./www
    index index.html
    error_page 404 ./errors/404.html
    client_max_body_size 2M

    location /Delete
        methods GET DELETE
        autoindex on    
        root ./www

    location /images 
        methods POST
        upload_store ./uploads

    location /cgi-bin 
        cgi_pass /usr/bin/python3