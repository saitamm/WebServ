
server
    listen 127.0.0.1:8800
    server_name localhost
    root 
    error_page 403 srcs/Server/errors/403.html
    error_page 405 srcs/Server/errors/405.html
    error_page 409 srcs/Server/errors/409.html
    error_page 404 srcs/Server/errors/404.html
    error_page 400 srcs/Server/errors/400.html
    error_page 200 srcs/Server/errors/200.html
    client_max_body_size 10000M
    index indexServer.html

    location /
        root www
        index index.html
        methods  GET POST DELETE
        autoindex on
        upload_store uploads
        cgi_extensions .py .php .pl
        # cgi_pass /usr/bin/python3 /usr/bin/php /usr/bin/perl
        # return 302 https://sudoku.com/fr

    location /images 
        methods POST
        upload_store ./uploads
   
