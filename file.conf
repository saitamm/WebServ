server
    listen 127.0.0.1:8000
    server_name localhost
    error_page 403 srcs/Server/errors/403.html
    error_page 405 srcs/Server/errors/405.html
    error_page 409 srcs/Server/errors/409.html
    error_page 404 srcs/Server/errors/404.html
    error_page 400 srcs/Server/errors/400.html
    error_page 200 srcs/Server/errors/200.html
    client_max_body_size 2M
    root ./www
    index index.html
    location /
         autoindex on
        methods GET DELETE POST
        root ./www
        # return 302 http://localhost:8080/fghfgh.html
    
    location /Keltoum
        autoindex on
        methods POST GET    
        upload_store uploads

    location /cgi-bin
        methods GET DELETE POST
        cgi_pass /usr/bin/python3
        upload_store uploads

server
    listen 127.0.0.1:8090
    server_name local
    root www
    error_page 403 srcs/Server/errors/403.html
    error_page 405 srcs/Server/errors/405.html
    error_page 409 srcs/Server/errors/409.html
    error_page 404 srcs/Server/errors/404.html
    error_page 400 srcs/Server/errors/400.html
    error_page 200 srcs/Server/errors/200.html
    client_max_body_size 2M
    index index.html
    location /
        autoindex on
        methods GET DELETE 
        root ./www
        upload_store ./uploads
        return 200 "Welcome to the server!\n"

    location /images 
        methods POST 
        upload_store ./uploads
   

